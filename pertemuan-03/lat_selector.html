<!DOCTYPE HTML>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <h1>PENDATAAN MAHASISWA</h1>
    <form action="#" method="post">
        <!-- Perbaikan: for="nim" terhubung ke id="nim" -->
        <label for="nim">NIM</label>
        <input type="text" id="nim" name="nim" required placeholder="Masukan Nim" class="form-control">
        
        <!-- Perbaikan: for="nama" terhubung ke id="nama" -->
        <label for="nama">Nama</label>
        <input type="text" id="nama" name="nama" required placeholder="Masukan nama" class="form-control">
        
        <!-- Perbaikan: Mengubah id radio button agar unik sehingga label klik berfungsi dengan benar -->
        <label>Jen Kel</label><br>
        <input type="radio" id="jenkel-l" name="jenkel" value="Laki-laki" required>
        <label for="jenkel-l">Laki-Laki</label>
        
        <input type="radio" id="jenkel-p" name="jenkel" value="Wanita">
        <label for="jenkel-p">Wanita</label><br>
        
        <button type="submit" id="tombol-kirim">Kirim</button>
    </form>
</body>
</html>
